<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>군위수서 주중이용권 리플렛 미리보기</title>
<style>
  :root { --w100: 340px; --w97: 330px; --h: 714px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Pretendard, "Malgun Gothic", sans-serif; background: #1c2320; color: #e8e8e8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px; }
  .top { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; justify-content: center; }
  h1 { font-size: 17px; font-weight: 700; }
  select { font: inherit; font-size: 14px; font-weight: 700; padding: 7px 12px; border-radius: 8px; border: 1px solid #2A9D8D; background: #26312e; color: #9fe0d3; cursor: pointer; }
  .sub { font-size: 12.5px; color: #94a5a0; margin-bottom: 18px; }
  .btns { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; }
  .btns button { font: inherit; font-size: 13px; font-weight: 600; padding: 9px 14px; border-radius: 8px; border: 1px solid #3c4a46; background: #26312e; color: #dfe6e3; cursor: pointer; }
  .btns button.on { background: #2A9D8D; border-color: #2A9D8D; color: #04231e; }
  .hint { font-size: 12px; color: #869692; margin-top: 18px; text-align: center; line-height: 1.6; }

  .stage-wrap { perspective: 2600px; }
  .book { position: relative; height: var(--h); transform-style: preserve-3d; transition: transform 0.8s ease; display: flex; }
  .pB { position: relative; width: var(--w100); height: var(--h); transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,0.45); }
  .face img { width: 100%; height: 100%; display: block; }
  .face.back { transform: rotateY(180deg); }
  .pA { position: absolute; left: calc(-1 * var(--w100)); top: 0; width: var(--w100); height: var(--h); transform-origin: right center; transform-style: preserve-3d; transition: transform 1s ease; z-index: 30; }
  .pC { position: absolute; left: var(--w100); top: 0; width: var(--w97); height: var(--h); transform-origin: left center; transform-style: preserve-3d; transition: transform 1s ease; z-index: 20; }

  .s0 .pC { transform: rotateY(-180deg); }
  .s0 .pA { transform: rotateY(-180deg); }
  .s1 .pC { transform: rotateY(-180deg); }
  .s1 .pA { transform: rotateY(0deg); }
  .s2 .pC { transform: rotateY(0deg); }
  .s2 .pA { transform: rotateY(0deg); }
  .s3 .pC { transform: rotateY(0deg); }
  .s3 .pA { transform: rotateY(0deg); }
  .s3.book { transform: rotateY(180deg); }
  .holder { transition: transform 0.8s ease; }

  .flat { display: none; gap: 2px; }
  .flat img { height: var(--h); display: block; box-shadow: 0 8px 40px rgba(0,0,0,0.45); }
  body.flatmode .stage-wrap { display: none; }
  body.flatmode .flat.active { display: flex; }
  .cap { text-align: center; font-size: 12px; color: #94a5a0; margin-top: 10px; }
</style>
</head>
<body>
<div class="top">
  <h1>군위수서 주중이용권 리플렛 미리보기</h1>
  <select id="ver"></select>
</div>
<div class="sub">버전을 고르고, 버튼을 누르면 실제 접히는 순서대로 펼쳐집니다</div>

<div class="btns">
  <button id="b0" class="on">① 닫힌 표지</button>
  <button id="b1">② 표지 열기</button>
  <button id="b2">③ 완전히 펼치기</button>
  <button id="b3">④ 뒤집어 보기</button>
  <button id="b4">표지면 평면</button>
  <button id="b5">안쪽면 평면</button>
</div>

<div class="stage-wrap">
  <div class="holder" id="holder">
    <div class="book s0" id="book">
      <div class="pB">
        <div class="face front"><img data-k="i3" alt=""></div>
        <div class="face back"><img data-k="o6" alt=""></div>
        <div class="pA">
          <div class="face front"><img data-k="i2" alt=""></div>
          <div class="face back"><img data-k="o1" alt=""></div>
        </div>
        <div class="pC">
          <div class="face front"><img data-k="i4" alt=""></div>
          <div class="face back"><img data-k="o5" alt=""></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="flat-wrap">
  <div class="flat" id="flatOut"><img data-k="o5"><img data-k="o6"><img data-k="o1"></div>
  <div class="flat" id="flatIn"><img data-k="i2"><img data-k="i3"><img data-k="i4"></div>
</div>

<div class="cap" id="cap">닫힌 상태 · 표지가 보입니다</div>
<div class="hint">실제 인쇄 파일과 동일한 렌더를 면별로 잘라 만든 화면입니다.<br>인쇄물은 A4 가로 3단접지(말아접기) 297 x 210mm로 제작됩니다.</div>

<script>
(function () {
  var BUILD = '202609071424';   // 이미지 캐시 무효화용. 빌드마다 갱신
  var VERS = [
    ['v2', 'v2'],
    ['v3b', 'v3'],
    ['v4', 'v4'],
    ['v5_ryu', 'v5 류성현'],
    ['v5_lee', 'v5 이승재'],
    ['v6_ryu', 'v6 류성현'],
    ['v6_lee', 'v6 이승재']
  ];

  var sel = document.getElementById('ver');
  VERS.forEach(function (v) {
    var o = document.createElement('option');
    o.value = v[0]; o.textContent = v[1];
    sel.appendChild(o);
  });
  sel.value = VERS[VERS.length - 1][0];
  if (VERS.length < 2) sel.style.display = 'none';

  var imgs = [].slice.call(document.querySelectorAll('img[data-k]'));
  function load(key) {
    imgs.forEach(function (im) { im.src = 'fold/' + key + '/' + im.getAttribute('data-k') + '.jpg?b=' + BUILD; });
  }
  sel.addEventListener('change', function () { load(sel.value); });

  var book = document.getElementById('book');
  var holder = document.getElementById('holder');
  var cap = document.getElementById('cap');
  var flatOut = document.getElementById('flatOut');
  var flatIn = document.getElementById('flatIn');
  var btns = ['b0','b1','b2','b3','b4','b5'].map(function (id) { return document.getElementById(id); });

  var caps = [
    '닫힌 상태 · 표지가 보입니다',
    '표지를 열면 · 왼쪽 내지와 오른쪽 접힘면이 함께 보입니다',
    '완전히 펼친 안쪽면',
    '뒤집어 본 표지면 전체',
    '표지면 평면 · 인쇄 시 한 판 (5 | 6 | 1)',
    '안쪽면 평면 · 인쇄 시 한 판 (2 | 3 | 4)'
  ];

  function setStage(n) {
    btns.forEach(function (b, i) { b.classList.toggle('on', i === n); });
    cap.textContent = caps[n];
    if (n <= 3) {
      document.body.classList.remove('flatmode');
      book.className = 'book s' + n;
      var w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--w100'));
      holder.style.transform = (n === 1) ? ('translateX(' + (w / 2) + 'px)') : 'translateX(0)';
    } else {
      document.body.classList.add('flatmode');
      flatOut.classList.toggle('active', n === 4);
      flatIn.classList.toggle('active', n === 5);
    }
  }
  btns.forEach(function (b, i) { b.addEventListener('click', function () { setStage(i); }); });

  function fit() {
    var scale = Math.min(1, (window.innerWidth - 40) / 1040, (window.innerHeight - 260) / 714);
    document.documentElement.style.setProperty('--h', (714 * scale) + 'px');
    document.documentElement.style.setProperty('--w100', (340 * scale) + 'px');
    document.documentElement.style.setProperty('--w97', (330 * scale) + 'px');
  }
  fit(); window.addEventListener('resize', fit);
  load(sel.value);
  setStage(0);
})();
</script>
</body>
</html>
